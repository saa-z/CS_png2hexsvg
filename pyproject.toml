[project]
name = "png2hexsvg"
version = "0.1.0"
readme = "README.md"
description=' Convert a png picture into a hexagonal svg'
authors = [{ name = "Salwa Azariouh", email = "salwa.azariouh@centrale.centralelille.fr" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/png2hexsvg"]


[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
